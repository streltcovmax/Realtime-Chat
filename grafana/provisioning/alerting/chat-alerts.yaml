apiVersion: 1

contactPoints:
  - orgId: 1
    name: chat-telegram-alerts
    receivers:
      - uid: chat-telegram-alerts
        type: telegram
        settings:
          bottoken: ${GRAFANA_TELEGRAM_BOT_TOKEN}
          chatid: ${GRAFANA_TELEGRAM_CHAT_ID}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: chat-telegram-alerts
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: Chat critical events
    folder: Chat
    interval: 1m
    rules:
      - uid: chat-opensearch-index-failed
        title: OpenSearch indexing failures
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              queryType: sql
              rawSql: "SELECT count() AS value FROM chat_analytics.events WHERE event_time >= now() - INTERVAL 5 MINUTE AND event_type = 'opensearch_index_failed'"
              refId: A
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          __dashboardUid__: c09113a7-d0f2-4151-bb83-45a569ab84fa
          __panelId__: "7"
          summary: OpenSearch indexing failures were recorded.
          description: Messages are being saved, but at least one indexing failure happened in the last 5 minutes.
        labels:
          service: chat
          component: opensearch
          severity: critical
        isPaused: false

      - uid: chat-opensearch-search-failed
        title: OpenSearch search failures
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              queryType: sql
              rawSql: "SELECT count() AS value FROM chat_analytics.events WHERE event_time >= now() - INTERVAL 5 MINUTE AND event_type = 'opensearch_search_failed'"
              refId: A
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          __dashboardUid__: c09113a7-d0f2-4151-bb83-45a569ab84fa
          __panelId__: "7"
          summary: OpenSearch search failures were recorded.
          description: At least one message search failed in the last 5 minutes.
        labels:
          service: chat
          component: opensearch
          severity: critical
        isPaused: false

