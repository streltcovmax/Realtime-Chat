          __dashboardUid__: c09113a7-d0f2-4151-bb83-45a569ab84fa
          __panelId__: "7"
          summary: Backend errors are increasing.
          description: Three or more backend_error events were recorded in the last 5 minutes.
        labels:
          service: chat
          component: backend
          severity: critical
        isPaused: false

