<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" spellcheck="false">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" media="all" href="/static/css/style.css">
    <link rel="icon" type="image/x-icon" href="/static/images/icon_colored.ico">
    <title>CHAT</title>
</head>
<body th:data-csrf-token="${csrfToken}" th:data-csrf-header="${csrfHeaderName}">

<div class="chats" id="chat-page">
    <div class="chats-panel br-r">
        <div class="chat-search-row">

            <div class="search-input-wrapper">
            <input autocomplete="off" type="text" id="searchUsername" name="search" placeholder="поиск" class="r">
            <button type="button" id="search-clear-btn" class="search-clear-btn hidden" title="Очистить">×</button>
        </div>

            <button type="button" id="create-group-button" class="group-action-button" title="Создать группу">+</button>

        </div>
        <div id="search-results-container" class="search-results-container hidden">
            <p class="search-results-label">Найдено:</p>
            <p id="search-no-results" class="search-no-results hidden">Ничего не найдено</p>
            <ul id="foundUsers"></ul>
        </div>
        <div id="chats-list-container" class="chats-list-container">
            <ul id="chats-list">
            </ul>
        </div>
        <div class="footer-panel">
            <button class="current-user-footer-container" id="this-profile-button">
                <span id="connected-user-avatar" class="chat-avatar r"></span>
                <span id="connected-user-fullname"></span>
            </button>
            <button id="logout-button">
                <img src="/static/images/exit.svg" alt="exit">
            </button>
        </div>
    </div>

    <div class="chat-area-wrap">
        <div class="chat-area hidden" id="chat-area">
            <div class="br-b" id="chat-header-info">
                <div id="chat-header-user-info-container">
                    <div class="chat-avatar r" id="selected-chat-avatar"></div>
                    <div>
                        <p id="chat-header-username"></p>
                        <span id="chat-header-status"></span>
                    </div>
                </div>
                <button id="search-messages-button">
                    <img src="/static/images/search.svg" alt="search">
                </button>
                <button type="button" id="group-manage-button" class="group-action-button hidden" title="Управление группой">...</button>
            </div>
            <div id="chat-messages" class="r">
            </div>
            <form id="messageForm" name="messageForm" class="br-t"
                  th:data-max-message-length="${maxMessageLength}">
                <p id="message-length-error" class="message-length-error hidden" role="alert" aria-live="polite"></p>
                <div class="message-input">
                    <textarea autocomplete="off" id="messageInput" placeholder="введите сообщение..."
                              class="r" rows="1"></textarea>
                    <button type="button" class="r" id="send-message-button"></button>
                </div>
            </form>
        </div>
        <div class="info-message r overlay" id="pick-chat-message"> выберите чат, или воспользуйтесь поиском</div>
        <div class="info-message r overlay hidden" id="empty-chat-message"> здесь пока пусто...</div>
    </div>

    <div class="sidepanel br-l">
    </div>
</div>

<div class="user-form hidden" id="search-page">
    <h2>Найти пользователей</h2>
</div>

<div id="group-modal" class="message-search-modal hidden" aria-hidden="true">
    <div id="group-modal-backdrop" class="message-search-modal-backdrop"></div>
    <div id="group-modal-dialog" class="message-search-modal-dialog r" role="dialog" aria-modal="true"
         aria-labelledby="group-modal-title">
        <h2 id="group-modal-title" class="message-search-modal-title">Группа</h2>
        <div class="group-form">
            <label>
                <span>Название</span>
                <input autocomplete="off" type="text" id="group-name-input" class="r">
            </label>
            <label>
                <span>Участники</span>
                <input autocomplete="off" type="text" id="group-members-input" class="r"
                       placeholder="username1, username2">
            </label>
            <p id="group-modal-status" class="search-no-results hidden"></p>
            <div class="group-modal-actions">
                <button type="button" id="group-save-button">Создать</button>
                <button type="button" id="group-cancel-button" class="secondary-button">Отмена</button>
            </div>
        </div>
    </div>
</div>

<div id="group-manage-modal" class="message-search-modal hidden" aria-hidden="true">
    <div id="group-manage-modal-backdrop" class="message-search-modal-backdrop"></div>
    <div id="group-manage-modal-dialog" class="message-search-modal-dialog r" role="dialog" aria-modal="true"
         aria-labelledby="group-manage-modal-title">
        <h2 id="group-manage-modal-title" class="message-search-modal-title">Управление группой</h2>
        <div class="group-modal-actions vertical">
            <button type="button" id="group-add-member-button">Добавить пользователя</button>
            <button type="button" id="group-remove-member-button">Удалить пользователя</button>
            <button type="button" id="group-leave-button" class="secondary-button">Выйти из группы</button>
            <button type="button" id="group-manage-close-button" class="secondary-button">Закрыть</button>
        </div>
        <p id="group-manage-status" class="search-no-results hidden"></p>
    </div>
</div>

<div id="message-search-modal" class="message-search-modal hidden" aria-hidden="true">
    <div id="message-search-modal-backdrop" class="message-search-modal-backdrop"></div>
    <div id="message-search-modal-dialog" class="message-search-modal-dialog r" role="dialog" aria-modal="true"
         aria-labelledby="message-search-modal-title">
        <h2 id="message-search-modal-title" class="message-search-modal-title">Поиск в чате</h2>
        <div class="search-input-wrapper message-search-input-wrap">
            <input autocomplete="off" type="text" id="message-search-query" class="r"
                   placeholder="поиск по сообщениям...">
        </div>
        <div class="search-results-container message-search-results">
            <p class="search-results-label">Результаты:</p>
            <p id="message-search-status" class="search-no-results">Введите минимум 2 символа</p>
            <ul id="message-search-list"></ul>
        </div>
    </div>
</div>

<div id="user-profile-modal" class="user-profile-modal hidden" aria-hidden="true">
    <div id="user-profile-modal-backdrop" class="user-profile-modal-backdrop"></div>
    <div id="user-profile-modal-dialog" class="user-profile-modal-dialog r" role="dialog" aria-modal="true"
         aria-labelledby="user-profile-modal-title">
        <div id="user-profile-modal-avatar" class="chat-avatar r user-profile-modal-avatar"></div>
        <div class="user-profile-modal-content">
            <h2 id="user-profile-modal-title" class="user-profile-modal-title"></h2>
            <dl class="user-profile-modal-list">
                <div>
                    <dt>Никнейм</dt>
                    <dd id="user-profile-modal-username"></dd>
                </div>
                <div>
                    <dt>Статус</dt>
                    <dd id="user-profile-modal-status"></dd>
                </div>
            </dl>
        </div>
    </div>
</div>

<script src="/static/js/lib/sockjs.min.js"></script>
<script src="/static/js/lib/stomp.min.js"></script>
<script type="module" src="/static/js/user.js"></script>
<script type="module" src="/static/js/script.js"></script>
</body>
</html>
